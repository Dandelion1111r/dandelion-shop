<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>

<title>Seite nicht gefunden – Dandelion 11:11</title>
<meta name="robots" content="noindex,follow">
<link rel="icon" type="image/png" href="Dandelionlogo-fixed.png">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;background:#fdf6ff;color:#3a2e3f;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.bubble{font-size:5rem;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
h1{font-size:clamp(1.6rem,5vw,2.4rem);font-weight:700;margin:20px 0 10px;color:#3a2e3f}
p{font-size:1rem;color:#6b5a7a;max-width:380px;line-height:1.65;margin-bottom:28px}
.btn-group{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{padding:13px 26px;border-radius:50px;font-family:inherit;font-size:.95rem;font-weight:600;text-decoration:none;cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(142,68,173,.25)}
.btn-primary{background:linear-gradient(135deg,#d63384,#8e44ad);color:#fff;border:none}
.btn-secondary{background:linear-gradient(135deg,#8e44ad,#d63384);color:#fff;border:none}
.code{font-size:.78rem;color:#b39dbf;margin-top:36px;letter-spacing:.5px}
</style>
</head>
<body>
  <div class="bubble">🎈</div>
  <h1>Diese Seite ist davongeflogen!</h1>
  <p>Der Ballon ist leider entwischt – die gesuchte Seite wurde nicht gefunden oder existiert nicht mehr.</p>
  <div class="btn-group">
    <a class="btn btn-primary" href="index.html">Zurück zur Startseite</a>
    <a class="btn btn-secondary" href="kollektionen.html">Kollektionen entdecken</a>
  </div>
  <p class="code">Fehler 404 – Seite nicht gefunden</p>
</body>
</html>
